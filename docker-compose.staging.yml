# Staging topology — LOCAL_STAGING_CONFIGURATION only.
#
# This is a STANDALONE file, not an override of docker-compose.yml. An override silently
# inherits the base entrypoint and environment, which is exactly how a staging stack ends
# up shipping demo credentials. Nothing here is inherited; everything is stated.
#
# Running this locally does NOT constitute hosted staging. It is a production-SHAPED
# configuration validated on a developer machine.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
#
# SINGLE PROCESS ONLY. The rate limiter (Workstream C) keeps its buckets in process
# memory, so N workers means N times the effective limit.
# MULTI_REPLICA_DEPLOYMENT_BLOCKED_PENDING_SHARED_OR_GATEWAY_RATE_LIMITING

name: dedunet-staging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
    # NO published port. The database is reachable only on the compose network. Its
    # absence here is the control; adding "ports:" would silently expose staging data.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # PostgreSQL needs headroom for shared_buffers, work_mem and connections.
          # 1 GiB is comfortable for a staging dataset and small enough to surface a
          # runaway query rather than consuming the host.
          memory: 1G
          cpus: "1.0"

  api:
    build:
      # Repository root, so the normalized brand package is reachable. Narrowed straight
      # back down by services/commerce-api/Dockerfile.dockerignore, which is an allowlist.
      context: .
      dockerfile: services/commerce-api/Dockerfile
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Declared so it can actually be overridden. Without this line COMMERCE_MODE never
      # reaches the container at all -- compose does not forward arbitrary shell variables
      # -- so `COMMERCE_MODE=BRAND_PREVIEW_MODE docker compose up -d api` silently did
      # nothing and staging always ran the default. A tester would believe they were in
      # brand preview while the store was in commerce-test mode.
      #
      # Empty default, NOT a literal mode: an empty value is falsy in modes.current_mode(),
      # which then applies DEFAULT_MODE. That preserves the previously verified staging
      # behaviour exactly while making the documented switch work:
      #
      #   COMMERCE_MODE=BRAND_PREVIEW_MODE docker compose -f docker-compose.staging.yml \
      #     --env-file .env.staging up -d api
      COMMERCE_MODE: ${COMMERCE_MODE:-}
      # No demo customer, administrator, product or order. The administrator is created
      # manually with `manage.py create-admin`, never by the entrypoint.
      SEED_DEMO_DATA: "0"
      # Rate limiting is ON. RATE_LIMIT_ENABLED=0 exists only as an emergency
      # troubleshooting switch and must not appear in a normal staging configuration.
      RATE_LIMIT_ENABLED: "1"
      # Local staging has no trusted proxy in front of it. Raising this without a real,
      # tested proxy chain would let any client spoof its bucket key.
      RATE_LIMIT_TRUSTED_PROXY_COUNT: "0"
      # And the SERVER must agree, because this setting is read too late to help on its
      # own: uvicorn's ProxyHeadersMiddleware rewrites the peer address from
      # X-Forwarded-For before any application code runs. `none` means the ASGI server
      # interprets no forwarded header from any peer. See app/server.py.
      TRUSTED_PROXY_MODE: "none"
      # Writes no .pyc, which is what makes read_only viable below.
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    # Exactly ONE process and ONE worker. Stated explicitly rather than relying on the
    # image default, so the constraint is visible in the deployed configuration.
    # app.server, not the bare `uvicorn` CLI: it passes proxy_headers and
    # forwarded_allow_ips explicitly instead of inheriting uvicorn's trusting defaults.
    command: ["python", "-m", "app.server", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${API_PORT:-18080}:8000"
    volumes:
      # Fixtures are checksum-protected and the API has no reason to write them.
      - ./services/commerce-api/data:/app/data:ro
    # The image filesystem is immutable at runtime. Verified, not assumed: logs go to
    # stdout, PYTHONDONTWRITEBYTECODE stops .pyc writes, migrations touch only the
    # database, and the API writes no uploads or backups.
    read_only: true
    tmpfs:
      # Only paths that genuinely need to be writable.
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /ready, not /health: readiness proves the database is actually reachable.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      # NOTE: replicas is deliberately absent. See the multi-replica block above.
      resources:
        limits:
          # The API is a single uvicorn process serving a modest staging load. 512 MiB
          # leaves room for SQLAlchemy pools and PBKDF2 hashing without hiding a leak.
          memory: 512M
          cpus: "1.0"

  notification-worker:
    # A SEPARATE PROCESS, not a thread in the API. A delivery thread inside the web
    # process would make /ready lie about a subsystem it does not check, and two API
    # replicas would double-send every message.
    build:
      # Same image as the API, so the two can never drift apart in version. That means the
      # same root context and the same allowlist.
      context: .
      dockerfile: services/commerce-api/Dockerfile
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Console until a real SMTP account exists. An unconfigured deployment must never
      # attempt to send real mail. EXTERNAL_SMTP_DELIVERY_PENDING.
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-console}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: "15"
      NOTIFICATION_BATCH_SIZE: "50"
      NOTIFICATION_MAX_ATTEMPTS: "5"
      # Bounds how long a worker killed mid-send can hold a claim before another
      # worker may recover it. Must exceed the slowest realistic provider call.
      NOTIFICATION_CLAIM_TTL_SECONDS: "300"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy
    # Bypasses the API entrypoint: the worker needs no migration, no seed and no
    # HTTP server. It runs one bounded dispatch cycle per interval.
    entrypoint: ["python", "-B", "notification_worker.py"]
    # NO ports. Nothing needs to reach the worker.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # SIGTERM is handled: the cycle in flight finishes, then the process exits 0.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  web:
    build:
      context: .
      # CUTOVER, 2026-08-27, docs/operations/STAGING_CUTOVER_PLAN.md, option A.
      #
      # ROLLBACK IS THIS ONE LINE. Restore:
      #
      #   dockerfile: apps/web/Dockerfile
      #   args:
      #     API_BASE_URL: "http://${STAGING_PUBLIC_HOST}:${API_PORT}"
      #
      # and drop the environment block below, then `up -d web`. The classic client, its
      # six jsdom harnesses and its eight guard mutations all remain in the tree
      # precisely so that revert has something to land on. Do not delete apps/web.
      dockerfile: apps/consumer/Dockerfile
      args:
        # DELIBERATELY NO API_BASE_URL.
        #
        # The consumer client reaches the API at /api on its own origin, proxied by the
        # nginx in this image (apps/consumer/default.conf.template). An absolute base
        # here would re-introduce the cross-origin topology this cutover removes, and
        # would bake a LAN address into a browser bundle.
        #
        # The admin portal is a SEPARATE surface that resolves the API itself and cannot
        # use that proxy, so it keeps its own cross-origin base — the same value the
        # classic image built it with, which is why CORS_ORIGINS needs no change.
        ADMIN_API_BASE_URL: "http://${STAGING_PUBLIC_HOST}:${API_PORT}"
    environment:
      # Where the API is from INSIDE the container. Equal to the image default, and
      # stated anyway: this file inherits nothing, and an upstream that is invisible in
      # the deployed configuration is one nobody checks when /api starts returning 502.
      DEDUNET_API_UPSTREAM: "api:8000"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-13080}:80"
    read_only: true
    tmpfs:
      # nginx needs these writable even when serving purely static content.
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
      # AND this one, which the classic image did NOT need and the consumer image does.
      #
      # The consumer image ships its nginx configuration as a TEMPLATE and renders it at
      # container start, because the API upstream must be configurable per deployment
      # without baking a host address into the image. nginx's entrypoint runs envsubst
      # over /etc/nginx/templates/*.template and writes the result HERE. With the root
      # filesystem read-only and no tmpfs on this path, that write fails, nginx never
      # starts, and the container restart-loops — which is exactly what happened on the
      # first cutover attempt on 2026-08-27.
      #
      # The candidate on 13081 did not catch it because it was run with plain
      # `docker run`, without read_only. The security posture is UNCHANGED by this line:
      # the filesystem is ephemeral RAM, re-rendered from the read-only image layer on
      # every start, and the served html directory remains read-only.
      - /etc/nginx/conf.d:size=1m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  staging-pgdata:
