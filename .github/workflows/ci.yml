name: CI
on:
  push:
  pull_request:

# Paths are relative to this PoC package root (the directory containing this
# .github/ folder), matching the pre-existing workflow convention.

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the Dockerfile base image; 3.13/3.14 match versions actually
        # installed on developer workstations. The divergence is a recorded risk
        # (SB-RISK-B2-001), so CI must prove the suite on all of them.
        python-version: ["3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node, for the jsdom harnesses that drive the browser clients.
      #
      # WITHOUT THIS, NINE GUARDS WERE NEVER CHECKED. The harnesses skip themselves when
      # node or jsdom is absent, a skipped test exits 0, and the mutation harness read that
      # as "the guard removal was not detected" -- so CI reported nine accepted behaviours
      # as unguarded while in fact it had not tested them at all. Among them: the preview
      # purchase refusal, the refusal reaching its control, and stale-session clearing on
      # 401.
      #
      # Only jsdom is installed, not the whole React Native toolchain: `apps/mobile` is
      # merely where these harnesses look for it (NODE_PATH), and pulling a mobile
      # dependency tree to render a <div> would be minutes of CI for nothing.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install jsdom for the browser-client harnesses
        run: npm install --no-save --prefix apps/mobile jsdom

      - name: Install backend dependencies
        working-directory: services/commerce-api
        run: pip install -r requirements.txt

      - name: Byte-compile backend and scripts
        run: python -m compileall -q services/commerce-api scripts

      - name: Browser-client harnesses must RUN, not skip
        working-directory: services/commerce-api
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: test
        # A skipped guard is not a passing guard. These three modules self-skip without
        # node and jsdom, which is how nine of them went unchecked; this step fails if they
        # skip rather than letting the suite report green over them.
        run: |
          python -m pytest -q -p no:cacheprovider -rs             tests/test_web_gallery.py             tests/test_storefront_purchase_refusal.py             tests/test_storefront_session_expiry.py             | tee harness-run.txt
          if grep -qE "skipped" harness-run.txt; then
            echo "FAIL: the browser-client harnesses skipped; node/jsdom is not available"
            exit 1
          fi
          rm -f harness-run.txt

      - name: Backend test suite
        working-directory: services/commerce-api
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          APP_ENV: test
        run: python -m pytest -q -p no:cacheprovider

      - name: Migrations must apply and reverse
        working-directory: services/commerce-api
        env:
          DATABASE_URL: "sqlite+pysqlite:///ci_migration_probe.sqlite3"
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          rm -f ci_migration_probe.sqlite3

      - name: Bootstrap must succeed from a clean database and be idempotent
        working-directory: services/commerce-api
        env:
          DATABASE_URL: "sqlite+pysqlite:///ci_bootstrap.sqlite3"
        run: |
          python manage.py bootstrap
          # A second seed must create nothing; non-idempotent seeding duplicates catalogue rows.
          python manage.py seed | tee second-seed.json
          python - <<'PY'
          import json
          created = json.load(open("second-seed.json"))["seeded"]
          assert all(v == 0 for v in created.values()), f"seed is not idempotent: {created}"
          print("OK: seed is idempotent")
          PY
          rm -f ci_bootstrap.sqlite3 second-seed.json

      - name: Exported API contract must match the application
        working-directory: services/commerce-api
        run: |
          python manage.py export-openapi
          # A drifted contract is worse than none: consumers integrate against a lie.
          git diff --exit-code ../../packages/contracts/openapi/openapi.json \
            || { echo "FAIL: docs/api/openapi.json is stale; run 'python manage.py export-openapi' and commit"; exit 1; }

      - name: No secrets committed
        run: |
          if git log --all --name-only --format="" | grep -qE '(^|/)\.env$'; then
            echo "FAIL: a .env file exists in git history"
            exit 1
          fi
          echo "OK: no .env in history"

      - name: Validate product master fixture
        run: python scripts/validation/validate_product_data.py

      - name: Validate candidate fixture (current state must be valid)
        run: python scripts/validation/validate_candidate_data.py

      - name: Candidate sellable/public activation must fail closed
        run: |
          set +e
          python scripts/validation/validate_candidate_data.py --assess-sellable
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "FAIL: synthetic candidate was reported eligible for sellable/public activation"
            exit 1
          fi
          echo "OK: activation correctly blocked (exit $status)"

      - name: Guard mutation check (negative tests must actually guard)
        run: python scripts/validation/mutation_guard_check.py

      - name: Preserved sample fixtures must be unchanged by the run
        run: |
          echo "536f91ab8dc4b43af80935696cc5485dd53afdbdd6d6541160fe37c7c59bce8d  services/commerce-api/data/products.json" | sha256sum -c -
          echo "7f052e4c8d75302695faa23b44efa7ed4e2f28ad64aaff9746d0109d8dab8323  services/commerce-api/data/candidate_products.json" | sha256sum -c -

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render compose configuration
        run: |
          cp .env.example .env
          docker compose config
      - name: Build images
        run: docker compose build

  postgres:
    # Parity job. The suite runs on in-memory SQLite everywhere else for speed; this job
    # is the only thing that proves the schema, the migrations and the timezone contract
    # behave identically on the engine that actually runs in Docker and staging.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql+psycopg://commerce:ci-only-not-a-secret@localhost:5432/commerce
      COMMERCE_TEST_DATABASE_URL: postgresql+psycopg://commerce:ci-only-not-a-secret@localhost:5432/commerce
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/commerce-api
        run: pip install -r requirements.txt

      - name: Migrations must apply, reverse and re-apply on PostgreSQL
        working-directory: services/commerce-api
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Schema must contain every expected table
        working-directory: services/commerce-api
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          tables = set(inspect(create_engine(os.environ["DATABASE_URL"])).get_table_names())
          expected = {
              "addresses", "analytics_events", "audit_logs", "cart_lines", "carts",
              "customers", "inventory_items", "notifications", "order_lines", "orders",
              "payments", "products", "promotions", "reservations", "return_requests",
              "shipments", "variants",
              # Pre-existing gap, closed here: product_media has existed since the DEDUNET
              # media phase and was never in this set, so the parity job never checked it.
              "product_media",
              # Multi-brand fashion network. Listed so the PostgreSQL parity job actually
              # covers the brand domain -- the check compares `expected - tables`, so a
              # table left out of this set is a table nobody notices is missing.
              "brands", "brand_ownership", "merchant_organizations",
              # Saved persistence: the curated look domain and the three personal relations.
              "looks", "look_items",
              "saved_looks", "favorite_products", "favorite_brands",
          }
          missing = expected - tables
          assert not missing, f"missing tables on PostgreSQL: {sorted(missing)}"
          print(f"OK: {len(expected)} expected tables present")
          PY

      - name: Bootstrap must be idempotent on PostgreSQL
        working-directory: services/commerce-api
        run: |
          python manage.py bootstrap
          python manage.py seed | tee second-seed.json
          python - <<'PY'
          import json
          created = json.load(open("second-seed.json"))["seeded"]
          assert all(v == 0 for v in created.values()), f"seed is not idempotent: {created}"
          print("OK: seed is idempotent")
          PY
          rm -f second-seed.json

      - name: Full suite against PostgreSQL
        working-directory: services/commerce-api
        # pytest.ini promotes warnings to errors, so an unhandled thread exception in the
        # 20-thread concurrency test fails this job rather than printing and passing.
        run: python -m pytest -q
