<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DEDUNET Operations</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Own copy of the base tokens. The admin app must not reach into apps/web:
         a cross-application source dependency prevents either being built, deployed
         or owned independently. Shipping them in one image is a packaging choice. -->
    <!-- Generated brand tokens, emitted here by the same build that emits
         brand.generated.js. The operations portal is not restyled in Phase 2, but the
         drift check covers both clients, so both must actually carry the artefact. -->
    <link rel="stylesheet" href="tokens.generated.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <p class="notice" role="note">
      Operations portal — fictional demonstration data. Actions here are real against the local
      database and are recorded in the audit log.
    </p>

    <header class="site">
      <a class="brand" href="#/orders" aria-label="DEDUNET operations home">DEDUNET · OPS</a>
      <nav class="nav" aria-label="Main">
        <a href="#/orders">Orders</a>
        <a href="#/inventory">Inventory</a>
        <a href="#/products">New product</a>
        <a href="#/audit">Audit</a>
        <a id="who" href="#/login">Sign in</a>
      </nav>
    </header>

    <div id="banner" aria-live="polite"></div>
    <main id="main" tabindex="-1"></main>

    <!-- config.js first: it may set window.DEDUNET_API_BASE, which api-config.js resolves.
         Both before admin.js, which takes its API base from that module — so there is one
         definition of where the API lives rather than one hard-coded per call site.
         Mirrors the storefront's config.js + media-url.js ordering. -->
    <script src="config.js"></script>
    <script src="api-config.js"></script>
    <script src="brand.generated.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
