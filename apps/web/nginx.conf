server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    # nginx turns a relative redirect into an absolute URL built from $host, which DROPS
    # the published port: "/" would send a browser on :13000 to port 80. Keeping
    # redirects relative preserves whatever host and port the client actually used.
    absolute_redirect off;

    # Bare "/" would otherwise render a directory listing. Send visitors to the store.
    location = / {
        return 302 /storefront/;
    }

    location / {
        index  index.html;
        try_files $uri $uri/ =404;
    }

    # This is a fictional demonstration build and must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
