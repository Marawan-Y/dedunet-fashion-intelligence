# THE DOCUMENT SECURITY HEADER CONTRACT — one file, included everywhere it must apply.
#
# WHY THIS FILE EXISTS, because the alternative looks correct and is not:
#
# nginx does NOT inherit `add_header` from an outer scope into a location that declares an
# `add_header` of its own. Declaring these four once at server level therefore protects
# only the locations that happen to add no header themselves. `location = /index.html` and
# `location /assets/` both set Cache-Control, so both silently dropped ALL FOUR of these —
# which meant every HTML document this application served carried none of them, while
# `/admin` (which declares nothing) carried all four and looked like proof it worked.
#
# That regression shipped to staging in the cutover at `455ac09` and is recorded as F-1 in
# `evidence/staging-cutover/STAGING_CUTOVER_EXECUTION.md`. The classic client in `apps/web`
# served three of these from a server-level block whose locations added no headers, so the
# contract was never tested by the thing that eventually broke it.
#
# THE RULE, enforced by `test_consumer_security_headers.py`:
#
#   every `location` block that declares its own `add_header` MUST also include this file.
#
# Values are not new policy. The first three are exactly what `apps/web/nginx.conf` served
# and what the owner accepted; `Referrer-Policy` was already declared at server level in
# the consumer template. Nothing here was invented during the repair.

# A non-public demonstration build with prototype products. Must never be indexed.
add_header X-Robots-Tag "noindex, nofollow" always;

# No MIME sniffing. The one header here that matters as much on a JSON API response and on
# a static asset as it does on a document.
add_header X-Content-Type-Options "nosniff" always;

# Not framable. Its absence is a clickjacking exposure, which is what made F-1 a launch
# blocker rather than a tidiness item.
add_header X-Frame-Options "DENY" always;

# Send the origin cross-site, the full URL same-site, and nothing over a downgrade.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
