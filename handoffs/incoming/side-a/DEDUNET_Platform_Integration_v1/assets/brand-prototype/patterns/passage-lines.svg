<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img">
  <title>DEDUNET Passage Lines pattern</title>
  <desc>Sparse line pattern with Resin source points.</desc>
  <rect width="1200" height="800" fill="#F6F1E7"/>
  <g stroke="#14120F" stroke-width="2" opacity="0.14">
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="180" y1="0" x2="180" y2="800"/><line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="1020" y1="0" x2="1020" y2="800"/>
  </g>
  <g fill="#A95122" opacity="0.55">
    <circle cx="180" cy="320" r="8"/><circle cx="600" cy="480" r="8"/><circle cx="1020" cy="160" r="8"/>
  </g>
</svg>
