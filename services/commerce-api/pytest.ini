[pytest]
# Warnings are failures by default.
#
# The concurrency tests spawn 20 threads against the database. A thread that dies with
# an unraisable exception, or a session left unclosed, surfaces only as a warning — and
# a run that prints warnings is not a green run. Promoting them to errors is what stops
# "83 passed, 4 warnings" being reported as fully verified.
#
# Every ignore below is a KNOWN third-party warning with a stated reason. Nothing is
# ignored because it was inconvenient.
filterwarnings =
    error
    # Starlette's TestClient imports httpx and warns that httpx2 is preferred. Raised at
    # import time by the framework, not by our code, and not actionable until FastAPI
    # moves. Scoped to the exact message so a different deprecation still fails.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning

# Thread and resource problems must never be silently downgraded.
#   -W error::pytest.PytestUnhandledThreadExceptionWarning is implied by "error" above.
addopts = -p no:cacheprovider
